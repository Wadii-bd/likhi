name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Put the app inside the desktop project
        shell: bash
        run: |
          mkdir -p desktop/app
          cp index.html desktop/app/index.html

      - name: Install
        working-directory: desktop
        run: npm install

      - name: Build installer and portable .exe
        working-directory: desktop
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload the .exe files
        uses: actions/upload-artifact@v4
        with:
          name: Likhi-Windows
          path: desktop/dist/*.exe

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
