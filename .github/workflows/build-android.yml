name: Build Android app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.LIKHI_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Put the app inside the Android project
        run: |
          mkdir -p android-app/www
          cp index.html android-app/www/index.html
          cp -r icons android-app/www/icons

      - name: Install
        working-directory: android-app
        run: npm install

      - name: Create the Android project
        working-directory: android-app
        run: npx cap add android

      - name: App icon and splash screen
        working-directory: android-app
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1F4D3A' --iconBackgroundColorDark '#1F4D3A' --splashBackgroundColor '#1F4D3A' --splashBackgroundColorDark '#1F4D3A'

      - name: Copy everything into the Android project
        working-directory: android-app
        run: npx cap sync android

      - name: Set the app version
        working-directory: android-app/android
        run: |
          sed -i 's/versionCode [0-9]*/versionCode 121/; s/versionName "[^"]*"/versionName "1.2.1"/' app/build.gradle
          grep -E "versionCode|versionName|applicationId" app/build.gradle

      - name: Build the signed APK (uses your secret key)
        if: env.HAS_KEY == 'true'
        working-directory: android-app/android
        env:
          LIKHI_KEYSTORE: ${{ secrets.LIKHI_KEYSTORE }}
          LIKHI_KEYSTORE_PASSWORD: ${{ secrets.LIKHI_KEYSTORE_PASSWORD }}
          LIKHI_KEY_ALIAS: ${{ secrets.LIKHI_KEY_ALIAS }}
          LIKHI_KEY_PASSWORD: ${{ secrets.LIKHI_KEY_PASSWORD }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "$LIKHI_KEYSTORE" | base64 -d > "$RUNNER_TEMP/likhi.keystore"
          chmod +x gradlew
          ./gradlew assembleRelease
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          mkdir -p ../../out
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/likhi.keystore" --ks-pass env:LIKHI_KEYSTORE_PASSWORD \
            --ks-key-alias "$LIKHI_KEY_ALIAS" --key-pass env:LIKHI_KEY_PASSWORD \
            --out ../../out/Likhi-1.2.1.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose ../../out/Likhi-1.2.1.apk

      - name: Build a test APK (no key added yet)
        if: env.HAS_KEY != 'true'
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/Likhi-1.2.1-test.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Likhi-Android
          path: out/*.apk

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
