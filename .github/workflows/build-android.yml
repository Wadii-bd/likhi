name: Build Android app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.LIKHI_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Put the app inside the Android project
        run: |
          mkdir -p android-app/www
          cp index.html android-app/www/index.html
          cp -r icons android-app/www/icons

      - name: Install
        working-directory: android-app
        run: npm install

      - name: Create the Android project
        working-directory: android-app
        run: npx cap add android

      - name: App icon and splash screen
        working-directory: android-app
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1F4D3A' --iconBackgroundColorDark '#1F4D3A' --splashBackgroundColor '#1F4D3A' --splashBackgroundColorDark '#1F4D3A'

      - name: Copy everything into the Android project
        working-directory: android-app
        run: npx cap sync android

      - name: Build the signed APK (uses your secret key)
        if: env.HAS_KEY == 'true'
        working-directory: android-app
        env:
          LIKHI_KEYSTORE: ${{ secrets.LIKHI_KEYSTORE }}
          LIKHI_KEYSTORE_PASSWORD: ${{ secrets.LIKHI_KEYSTORE_PASSWORD }}
          LIKHI_KEY_ALIAS: ${{ secrets.LIKHI_KEY_ALIAS }}
          LIKHI_KEY_PASSWORD: ${{ secrets.LIKHI_KEY_PASSWORD }}
        run: |
          echo "$LIKHI_KEYSTORE" | base64 -d > "$RUNNER_TEMP/likhi.keystore"
          npx cap build android --androidreleasetype APK --signing-type apksigner \
            --keystorepath "$RUNNER_TEMP/likhi.keystore" --keystorepass "$LIKHI_KEYSTORE_PASSWORD" \
            --keystorealias "$LIKHI_KEY_ALIAS" --keystorealiaspass "$LIKHI_KEY_PASSWORD"
          mkdir -p ../out
          cp "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)" ../out/Likhi-1.2.1.apk

      - name: Build a test APK (no key added yet)
        if: env.HAS_KEY != 'true'
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/Likhi-1.2.1-test.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Likhi-Android
          path: out/*.apk

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
